<svg xmlns="http://www.w3.org/2000/svg" width="320" height="110" viewBox="0 0 480 165" role="img" aria-label="Nomadic Almanac — World Travel Intelligence">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500&amp;display=swap');
      .naml-compass { transform-box: view-box; transform-origin: 82px 82px; animation: namlSway 6s ease-in-out infinite; will-change: transform; }
      .naml-needle  { transform-box: view-box; transform-origin: 82px 82px; animation: namlSettle 2.2s cubic-bezier(0.34,1.56,0.64,1) forwards, namlOsc 4s ease-in-out 2.2s infinite; will-change: transform; }
      .naml-ship    { transform-box: view-box; transform-origin: 300px 118px; animation: namlShip 4.5s ease-in-out infinite; will-change: transform; }
      .naml-waves   { transform-box: view-box; transform-origin: 300px 124px; animation: namlWave 3.2s ease-in-out infinite; will-change: transform; }
      .naml-dragon  { transform-box: view-box; transform-origin: 410px 130px; animation: namlDragon 5s ease-in-out infinite; will-change: transform; }
      .naml-flame   { transform-box: view-box; transform-origin: 396px 132px; animation: namlFlame 0.55s ease-in-out infinite alternate; will-change: transform, opacity; }
      .naml-flame-b { animation-delay: 0.18s; }
      @keyframes namlSettle { 0% { transform: rotate(160deg); } 100% { transform: rotate(0deg); } }
      @keyframes namlOsc    { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(0.9deg); } 75% { transform: rotate(-0.9deg); } }
      @keyframes namlSway   { 0%,100% { transform: rotate(-0.6deg); } 50% { transform: rotate(0.6deg); } }
      @keyframes namlShip   { 0%,100% { transform: rotate(-2.2deg) translateY(0); } 50% { transform: rotate(2.6deg) translateY(-1px); } }
      @keyframes namlWave   { 0%,100% { transform: translateX(0); } 50% { transform: translateX(2.5px); } }
      @keyframes namlDragon { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
      @keyframes namlFlame  { 0% { transform: scale(0.85, 0.9); opacity: 0.55; } 100% { transform: scale(1.12, 1.05); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .naml-compass, .naml-needle, .naml-ship, .naml-waves, .naml-dragon, .naml-flame {
          animation: none !important; transform: none !important;
        }
      }
    </style>
    <linearGradient id="naml-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F5ECD0"/>
      <stop offset="55%" stop-color="#EFE2B7"/>
      <stop offset="100%" stop-color="#E2D098"/>
    </linearGradient>
    <radialGradient id="naml-vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5A4A20" stop-opacity="0.28"/>
    </radialGradient>
    <radialGradient id="naml-rose-bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#F8F1D8"/>
      <stop offset="85%" stop-color="#EDDFB4"/>
      <stop offset="100%" stop-color="#D7BF85"/>
    </radialGradient>
    <clipPath id="naml-rightclip"><rect x="158" y="10" width="317" height="145"/></clipPath>
  </defs>

  <!-- Parchment base + vignette -->
  <rect width="480" height="165" fill="url(#naml-parch)"/>
  <rect width="480" height="165" fill="url(#naml-vignette)"/>

  <!-- Outer + inner border lines (no crosses) -->
  <rect x="5"  y="5"  width="470" height="155" fill="none" stroke="#1B2A4A" stroke-width="1.4"/>
  <rect x="9"  y="9"  width="462" height="147" fill="none" stroke="#B8960C" stroke-width="0.55"/>
  <rect x="12" y="12" width="456" height="141" fill="none" stroke="#B8960C" stroke-width="0.25" stroke-opacity="0.6"/>

  <!-- 4-point compass-star corner ornaments (replacing the crosses) -->
  <g fill="#B8960C">
    <g transform="translate(18,18)"><polygon points="0,-5.5 1.6,-1.6 5.5,0 1.6,1.6 0,5.5 -1.6,1.6 -5.5,0 -1.6,-1.6"/><circle r="1.1" fill="#1B2A4A"/></g>
    <g transform="translate(462,18)"><polygon points="0,-5.5 1.6,-1.6 5.5,0 1.6,1.6 0,5.5 -1.6,1.6 -5.5,0 -1.6,-1.6"/><circle r="1.1" fill="#1B2A4A"/></g>
    <g transform="translate(18,147)"><polygon points="0,-5.5 1.6,-1.6 5.5,0 1.6,1.6 0,5.5 -1.6,1.6 -5.5,0 -1.6,-1.6"/><circle r="1.1" fill="#1B2A4A"/></g>
    <g transform="translate(462,147)"><polygon points="0,-5.5 1.6,-1.6 5.5,0 1.6,1.6 0,5.5 -1.6,1.6 -5.5,0 -1.6,-1.6"/><circle r="1.1" fill="#1B2A4A"/></g>
  </g>

  <!-- ============ RIGHT PANEL: antique map background ============ -->
  <g clip-path="url(#naml-rightclip)">

    <!-- Latitude / longitude grid -->
    <g stroke="#7A5B33" stroke-width="0.3" opacity="0.32">
      <line x1="175" y1="15" x2="175" y2="152"/>
      <line x1="200" y1="15" x2="200" y2="152"/>
      <line x1="225" y1="15" x2="225" y2="152"/>
      <line x1="250" y1="15" x2="250" y2="152"/>
      <line x1="275" y1="15" x2="275" y2="152"/>
      <line x1="300" y1="15" x2="300" y2="152"/>
      <line x1="325" y1="15" x2="325" y2="152"/>
      <line x1="350" y1="15" x2="350" y2="152"/>
      <line x1="375" y1="15" x2="375" y2="152"/>
      <line x1="400" y1="15" x2="400" y2="152"/>
      <line x1="425" y1="15" x2="425" y2="152"/>
      <line x1="450" y1="15" x2="450" y2="152"/>
      <line x1="160" y1="30"  x2="475" y2="30"/>
      <line x1="160" y1="50"  x2="475" y2="50"/>
      <line x1="160" y1="70"  x2="475" y2="70"/>
      <line x1="160" y1="90"  x2="475" y2="90"/>
      <line x1="160" y1="110" x2="475" y2="110"/>
      <line x1="160" y1="130" x2="475" y2="130"/>
    </g>

    <!-- Curved meridian (equator-ish arc) -->
    <path d="M 160,90 Q 320,82 475,90" fill="none" stroke="#7A5B33" stroke-width="0.45" opacity="0.45" stroke-dasharray="2 1.5"/>

    <!-- Continent silhouettes -->
    <g fill="#8B6F47" opacity="0.22">
      <path d="M 240,35 Q 270,30 295,38 Q 322,32 350,40 Q 378,46 392,58 Q 396,72 378,80 Q 358,86 332,82 Q 305,88 278,80 Q 252,76 244,62 Q 238,48 240,35 Z"/>
      <path d="M 286,76 Q 294,82 296,92 Q 290,98 285,93 Q 283,84 286,76 Z"/>
      <path d="M 318,82 Q 330,86 334,100 Q 332,116 322,124 Q 313,128 308,118 Q 306,102 312,90 Z"/>
      <path d="M 300,72 Q 312,72 314,82 Q 308,86 302,82 Z"/>
      <path d="M 405,115 Q 428,110 445,118 Q 450,128 434,134 Q 414,134 404,124 Z"/>
      <circle cx="396" cy="105" r="1.2"/>
      <circle cx="402" cy="108" r="0.9"/>
      <circle cx="388" cy="112" r="1"/>
    </g>

    <!-- Map labels — Latin / archaic exonyms in faded italic -->
    <g fill="#5A4A20" opacity="0.55" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="500">
      <text x="195" y="42"  font-size="5.4" letter-spacing="0.9">OCEANUS</text>
      <text x="290" y="50"  font-size="5.4" letter-spacing="0.9">CATAY</text>
      <text x="287" y="105" font-size="4.4" letter-spacing="0.6">INDIA</text>
      <text x="190" y="138" font-size="5.2" letter-spacing="0.7">TERRA INCOGNITA</text>
      <text x="410" y="146" font-size="4.5" letter-spacing="0.6">NEW HOLLAND</text>
      <text x="455" y="28"  font-size="4"   letter-spacing="0.5" text-anchor="end">RUSSIA</text>
    </g>

    <!-- Rhumb lines from a small inset rose -->
    <g stroke="#8B6F47" stroke-width="0.3" opacity="0.3">
      <line x1="350" y1="92" x2="200" y2="40"/>
      <line x1="350" y1="92" x2="200" y2="140"/>
      <line x1="350" y1="92" x2="475" y2="50"/>
      <line x1="350" y1="92" x2="475" y2="135"/>
    </g>
    <circle cx="350" cy="92" r="2.5" fill="none" stroke="#8B6F47" stroke-width="0.4" opacity="0.45"/>

    <!-- ===== Animated ship fighting waves ===== -->
    <g class="naml-waves" stroke="#1B2A4A" stroke-width="0.45" fill="none" opacity="0.55">
      <path d="M 282,122 Q 286,120 290,122 T 298,122 T 306,122 T 314,122 T 322,122"/>
      <path d="M 280,125 Q 284,123 288,125 T 296,125 T 304,125 T 312,125 T 320,125" opacity="0.65"/>
      <path d="M 278,128 Q 282,126 286,128 T 294,128 T 302,128 T 310,128 T 318,128" opacity="0.4"/>
    </g>
    <g class="naml-ship">
      <g transform="translate(300,118)">
        <path d="M -8,-1 L 8,-1 L 6.5,3 L -6.5,3 Z" fill="#5A4A20" stroke="#1B2A4A" stroke-width="0.4"/>
        <line x1="-7" y1="0" x2="7" y2="0" stroke="#B8960C" stroke-width="0.3"/>
        <line x1="0" y1="-1" x2="0" y2="-12" stroke="#5A4A20" stroke-width="0.55"/>
        <line x1="-3.5" y1="-8" x2="3.5" y2="-8" stroke="#5A4A20" stroke-width="0.3"/>
        <path d="M 0,-11 Q 5,-8 4.5,-3 L 0,-3 Z" fill="#F5ECD0" stroke="#5A4A20" stroke-width="0.35"/>
        <path d="M 0,-11 Q -3.5,-8 -3.5,-3 L 0,-3 Z" fill="#F5ECD0" stroke="#5A4A20" stroke-width="0.35" opacity="0.92"/>
        <path d="M 0,-12 L 4,-11 L 0,-10 Z" fill="#C0392B"/>
      </g>
    </g>

    <!-- ===== Animated dragon breathing fire ===== -->
    <g class="naml-dragon">
      <g transform="translate(410,130)">
        <path d="M 9,3 Q 16,3 19,6 Q 18,9 14,8 Q 16,7 14,6" fill="none" stroke="#5A4A20" stroke-width="1.1" opacity="0.7" stroke-linecap="round"/>
        <path d="M -2,0 Q 4,-3 10,-1 Q 13,3 9,5 Q 3,7 -2,5 Q -5,3 -2,0 Z" fill="#5A4A20" opacity="0.75"/>
        <path d="M 5,-2 Q 9,-8 13,-5 Q 11,-1 7,0 Z" fill="#5A4A20" opacity="0.6"/>
        <path d="M 10,-6 L 11,-4 L 12,-6" fill="none" stroke="#5A4A20" stroke-width="0.3" opacity="0.7"/>
        <path d="M -2,1 Q -6,0 -9,2 L -10.5,3 L -8,3 Q -5,4 -2,3 Z" fill="#5A4A20" opacity="0.78"/>
        <line x1="-8" y1="2" x2="-9" y2="0" stroke="#5A4A20" stroke-width="0.4" opacity="0.7"/>
        <circle cx="-7" cy="1.6" r="0.55" fill="#C0392B"/>
      </g>
      <g class="naml-flame">
        <path d="M 401,132 Q 395,130 390,132 Q 386,132.5 384,132 Q 388,133 393,132.5 Q 396,133 401,132 Z" fill="#E67E22"/>
        <path d="M 401,132.5 Q 397,131.5 393,132.5 Q 390,133 388,132.7 Q 392,133.5 396,132.8 Z" fill="#FDD835"/>
      </g>
      <g class="naml-flame naml-flame-b">
        <path d="M 400,133 Q 395,134.5 390,134 Q 387,134.3 385,134 Q 389,135 393,134.5 Z" fill="#C0392B" opacity="0.85"/>
      </g>
    </g>
  </g>

  <!-- Vertical divider -->
  <line x1="158" y1="26" x2="158" y2="139" stroke="#1B2A4A" stroke-width="0.8" stroke-opacity="0.7"/>
  <circle cx="158" cy="26"  r="1.3" fill="#B8960C"/>
  <circle cx="158" cy="139" r="1.3" fill="#B8960C"/>

  <!-- ============ COMPASS ============ -->
  <g class="naml-compass">
    <circle cx="82" cy="82" r="64" fill="url(#naml-rose-bg)"/>
    <circle cx="82" cy="82" r="64" stroke="#1B2A4A" stroke-width="1.5" fill="none"/>
    <circle cx="82" cy="82" r="60" stroke="#B8960C" stroke-width="0.55" fill="none"/>
    <circle cx="82" cy="82" r="56" stroke="#1B2A4A" stroke-width="0.4" fill="none" opacity="0.5"/>
    <circle cx="82" cy="82" r="38" stroke="#B8960C" stroke-width="0.3" fill="none" opacity="0.5"/>

    <g stroke="#1B2A4A">
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(15 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(30 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1" transform="rotate(45 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(60 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(75 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1" transform="rotate(90 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(105 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(120 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1" transform="rotate(135 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(150 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(165 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1" transform="rotate(180 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(195 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(210 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1" transform="rotate(225 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(240 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(255 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1" transform="rotate(270 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(285 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(300 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="26" stroke-width="1.1" transform="rotate(315 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(330 82 82)"/>
      <line x1="82" y1="20" x2="82" y2="23" stroke-width="0.45" opacity="0.7" transform="rotate(345 82 82)"/>
    </g>

    <!-- 4 cardinal long points (navy + gold half-tone) -->
    <g fill="#1B2A4A">
      <polygon points="82,26 86,78 82,82 78,78"/>
      <polygon points="82,138 86,86 82,82 78,86"/>
      <polygon points="138,82 86,78 82,82 86,86"/>
      <polygon points="26,82 78,78 82,82 78,86"/>
    </g>
    <g fill="#B8960C">
      <polygon points="82,26 82,82 78,78"/>
      <polygon points="82,138 82,82 78,86"/>
      <polygon points="138,82 82,82 86,86"/>
      <polygon points="26,82 82,82 78,86"/>
    </g>

    <!-- 4 inter-cardinal long points (navy + gold half-tone) -->
    <g fill="#1B2A4A">
      <polygon points="121,43 86,78 82,82 78,78" transform="rotate(0 82 82)"/>
      <polygon points="121,43 86,78 82,82 78,78" transform="rotate(90 82 82)"/>
      <polygon points="121,43 86,78 82,82 78,78" transform="rotate(180 82 82)"/>
      <polygon points="121,43 86,78 82,82 78,78" transform="rotate(270 82 82)"/>
    </g>

    <!-- 8 shorter intermediate points (gold) -->
    <g fill="#B8960C" opacity="0.85">
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(22.5 82 82)"/>
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(67.5 82 82)"/>
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(112.5 82 82)"/>
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(157.5 82 82)"/>
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(202.5 82 82)"/>
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(247.5 82 82)"/>
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(292.5 82 82)"/>
      <polygon points="82,38 85,80 82,82 79,80" transform="rotate(337.5 82 82)"/>
    </g>

    <!-- N / E / S / W cardinal letters -->
    <text x="82" y="18"  text-anchor="middle" font-size="9" font-family="Cormorant Garamond,Georgia,serif" font-weight="700" fill="#1B2A4A">N</text>
    <text x="82" y="151" text-anchor="middle" font-size="9" font-family="Cormorant Garamond,Georgia,serif" font-weight="700" fill="#1B2A4A">S</text>
    <text x="151" y="85" text-anchor="middle" font-size="9" font-family="Cormorant Garamond,Georgia,serif" font-weight="700" fill="#1B2A4A">E</text>
    <text x="13"  y="85" text-anchor="middle" font-size="9" font-family="Cormorant Garamond,Georgia,serif" font-weight="700" fill="#1B2A4A">W</text>

    <!-- Animated needle: RED north, navy south -->
    <g class="naml-needle">
      <polygon points="82,34 86,80 82,82 78,80" fill="#C0392B"/>
      <polygon points="82,130 86,84 82,82 78,84" fill="#1B2A4A"/>
      <circle cx="82" cy="82" r="4" fill="#B8960C" stroke="#1B2A4A" stroke-width="0.6"/>
      <circle cx="82" cy="82" r="1.4" fill="#1B2A4A"/>
    </g>
  </g>

  <!-- ============ WORDMARK ============ -->
  <text x="175" y="62" font-family="Cormorant Garamond,Georgia,serif" font-size="26" font-weight="700" letter-spacing="5" fill="#1B2A4A">NOMADIC</text>
  <line x1="175" y1="74" x2="252" y2="74" stroke="#B8960C" stroke-width="0.8"/>
  <polygon points="276,70 281,74 276,78 271,74" fill="#B8960C"/>
  <line x1="290" y1="74" x2="367" y2="74" stroke="#B8960C" stroke-width="0.8"/>
  <text x="175" y="96" font-family="Cormorant Garamond,Georgia,serif" font-size="22" font-weight="600" letter-spacing="6" fill="#B8960C">ALMANAC</text>
  <text x="175" y="118" font-family="Cormorant Garamond,Georgia,serif" font-size="7.5" font-style="italic" letter-spacing="2.5" fill="#1B2A4A" opacity="0.75">WORLD TRAVEL INTELLIGENCE</text>
</svg>
