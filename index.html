<!-- Loading overlay — dismissed by JS as soon as the map is ready.
     Safety timer guarantees it never blocks the page for more than 6 s. -->
<div id="loading-overlay">
  <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" style="width:64px;height:64px;animation:lo-spin 8s linear infinite">
    <circle cx="28" cy="28" r="25" fill="#100c05" stroke="#c9a84c" stroke-width="1.6"/>
    <polygon points="28,3 31.5,21 28,18 24.5,21" fill="#e8d5a3"/>
    <polygon points="28,3 29.5,13 28,15 26.5,13" fill="#9b1c2e"/>
    <polygon points="53,28 36,31 39,28 36,25" fill="#c9a84c" opacity="0.55"/>
    <polygon points="3,28 20,31 17,28 20,25" fill="#c9a84c" opacity="0.55"/>
    <circle cx="28" cy="28" r="5" fill="#100c05" stroke="#c9a84c" stroke-width="1.4"/>
    <circle cx="28" cy="28" r="1.5" fill="#c9a84c"/>
  </svg>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:#e8d5a3;letter-spacing:4px;margin-top:18px">NOMADIC ALMANAC</div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#7a8a5a;letter-spacing:2px;margin-top:6px">LOADING WORLD DATA&hellip;</div>
</div>
<script>
  // Hard safety valve: dismiss overlay after 3 s regardless of JS/network state.
  // app.js cancels this timer (dismissOverlay) as soon as the map is ready.
  window._loTimer = setTimeout(function() {
    var lo = document.getElementById('loading-overlay');
    if (!lo) return;
    lo.style.transition = 'opacity 0.5s';
    lo.style.opacity    = '0';
    setTimeout(function() { if (lo.parentNode) lo.parentNode.removeChild(lo); }, 520);
  }, 3000);
</script>

    <div id="logo">

<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&amp;display=swap');
    /* Compass bezel rocks with the boat; needle stays fixed seeking North */
    .naml-cring { transform-box:view-box; transform-origin:82px 82px; animation:namlBoatRoll 5.5s ease-in-out infinite; }
    .naml-needle{ transform-box:view-box; transform-origin:82px 82px; animation:namlSettle 2.2s cubic-bezier(0.34,1.56,0.64,1) forwards, namlSeek 8s ease-in-out 2.2s infinite; will-change:transform; }
    /* Ship sails and rocks in swell */
    .naml-ship  { transform-box:view-box; transform-origin:295px 113px; animation:namlShipRock 3.8s ease-in-out infinite; }
    .naml-sail  { transform-box:view-box; transform-origin:295px 105px; animation:namlSailBow 2.4s ease-in-out infinite alternate; }
    .naml-wv    { animation:namlWave 2.6s ease-in-out infinite; }
    /* Dragon swims and breathes fire */
    .naml-drg   { animation:namlDrgSwim 4.2s ease-in-out infinite; }
    .naml-dtail { transform-box:view-box; transform-origin:460px 140px; animation:namlTailSwish 1.6s ease-in-out infinite alternate; }
    .naml-fire  { transform-box:view-box; transform-origin:408px 135px; animation:namlFlicker 0.38s ease-in-out infinite alternate; }
    .naml-fire2 { animation-delay:0.13s; }
    .naml-fire3 { animation-delay:0.25s; }
    .naml-fglow { animation:namlGlow 0.7s ease-in-out infinite alternate; }
    @keyframes namlBoatRoll { 0%,100%{transform:rotate(-2.8deg)} 50%{transform:rotate(2.8deg)} }
    @keyframes namlSettle   { 0%{transform:rotate(160deg)} 100%{transform:rotate(0deg)} }
    @keyframes namlSeek     { 0%,100%{transform:rotate(0deg)} 12%{transform:rotate(3.5deg)} 28%{transform:rotate(-2.2deg)} 44%{transform:rotate(1.8deg)} 60%{transform:rotate(-1.2deg)} 76%{transform:rotate(0.8deg)} 92%{transform:rotate(-0.3deg)} }
    @keyframes namlShipRock { 0%,100%{transform:rotate(-4.5deg) translateY(0)} 50%{transform:rotate(4deg) translateY(-1.8px)} }
    @keyframes namlSailBow  { 0%{transform:scaleX(0.9) skewY(-1deg)} 100%{transform:scaleX(1.06) skewY(1deg)} }
    @keyframes namlWave     { 0%,100%{transform:translateX(0)} 50%{transform:translateX(3.5px)} }
    @keyframes namlDrgSwim  { 0%,100%{transform:translateY(0) rotate(-1.2deg)} 25%{transform:translateY(-2.5px) rotate(1.8deg)} 50%{transform:translateY(-0.8px) rotate(-0.8deg)} 75%{transform:translateY(-2.8px) rotate(2.2deg)} }
    @keyframes namlTailSwish{ 0%{transform:rotate(-9deg)} 100%{transform:rotate(9deg)} }
    @keyframes namlFlicker  { 0%{transform:scale(0.78,0.82) translateX(0); opacity:0.45} 100%{transform:scale(1.18,1.12) translateX(2.5px); opacity:1} }
    @keyframes namlGlow     { 0%{opacity:0.15} 100%{opacity:0.55} }
    @media (prefers-reduced-motion:reduce){
      .naml-cring,.naml-needle,.naml-ship,.naml-sail,.naml-wv,.naml-drg,.naml-dtail,.naml-fire,.naml-fglow{
        animation:none!important; transform:none!important; }
    }
  </style>
