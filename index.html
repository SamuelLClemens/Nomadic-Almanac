<!-- Loading overlay — dismissed by JS as soon as the map is ready.
     Safety timer guarantees it never blocks the page for more than 6 s. -->
<div id="loading-overlay">
  <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" style="width:64px;height:64px;animation:lo-spin 8s linear infinite">
    <circle cx="28" cy="28" r="25" fill="#100c05" stroke="#c9a84c" stroke-width="1.6"/>
    <polygon points="28,3 31.5,21 28,18 24.5,21" fill="#e8d5a3"/>
    <polygon points="28,3 29.5,13 28,15 26.5,13" fill="#9b1c2e"/>
    <polygon points="53,28 36,31 39,28 36,25" fill="#c9a84c" opacity="0.55"/>
    <polygon points="3,28 20,31 17,28 20,25" fill="#c9a84c" opacity="0.55"/>
    <circle cx="28" cy="28" r="5" fill="#100c05" stroke="#c9a84c" stroke-width="1.4"/>
    <circle cx="28" cy="28" r="1.5" fill="#c9a84c"/>
  </svg>
  <div style="font-family:'Cinzel','Cinzel Decorative',Georgia,serif;font-size:13px;font-weight:700;color:#E8D8A0;letter-spacing:5px;margin-top:18px;text-transform:uppercase">Nomadic Almanac</div>
  <div style="font-family:'Cinzel',Georgia,serif;font-size:8px;color:#A89060;letter-spacing:3px;margin-top:6px;text-transform:uppercase">Loading World Data&hellip;</div>
</div>
<script>
  // Hard safety valve: dismiss overlay after 3 s regardless of JS/network state.
  // app.js cancels this timer (dismissOverlay) as soon as the map is ready.
  window._loTimer = setTimeout(function() {
    var lo = document.getElementById('loading-overlay');
    if (!lo) return;
    lo.style.transition = 'opacity 0.5s';
    lo.style.opacity    = '0';
    setTimeout(function() { if (lo.parentNode) lo.parentNode.removeChild(lo); }, 520);
  }, 3000);
</script>

    <div id="logo">
      <div id="logo-wrap"><svg id="na-logo" xmlns="http://www.w3.org/2000/svg" width="320" height="110" viewBox="0 0 480 165" role="img" aria-label="Nomadic Almanac — World Travel Intelligence">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&display=swap');
    /* Compass bezel rocks with swell; needle seeks magnetic north independently */
    .naml-cring { transform-box:view-box; transform-origin:82px 82px; animation:namlBoatRoll 5.5s ease-in-out infinite; }
    .naml-needle{ transform-box:view-box; transform-origin:82px 82px; animation:namlSettle 2.4s cubic-bezier(0.34,1.2,0.64,1) forwards, namlSeek 8s ease-in-out 2.4s infinite; will-change:transform; }
    /* Sailing ship — heave + roll combined via a wrapper/inner split */
    .naml-ship  { transform-box:view-box; transform-origin:293px 115px; animation:namlShipHull 4s ease-in-out infinite; }
    .naml-sail  { transform-box:view-box; transform-origin:292px 105px; animation:namlSailBow 2.1s ease-in-out infinite alternate; }
    .naml-wv    { animation:namlWave 2.6s ease-in-out infinite; }
    /* Dragon — body coils with phase-delayed segments */
    .naml-drg   { animation:namlDrgSwim 5s ease-in-out infinite; }
    .naml-dtail { transform-box:view-box; transform-origin:460px 140px; animation:namlTailSwish 1.6s ease-in-out infinite alternate; }
    .naml-fire  { transform-box:view-box; transform-origin:399px 133px; animation:namlFlicker 0.38s ease-in-out infinite alternate; }
    .naml-fire2 { animation-delay:0.13s; }
    .naml-fire3 { animation-delay:0.25s; }
    .naml-fglow { animation:namlGlow 0.7s ease-in-out infinite alternate; }
    /* Compass needle: settle from 90deg east, overshoot, damp to idle micro-oscillation */
    @keyframes namlSettle {
      0%   { transform: rotate(90deg); }
      35%  { transform: rotate(-15deg); }
      55%  { transform: rotate(8deg); }
      70%  { transform: rotate(-4deg); }
      82%  { transform: rotate(2deg); }
      91%  { transform: rotate(-1deg); }
      100% { transform: rotate(0.3deg); }
    }
    @keyframes namlSeek {
      0%,100% { transform: rotate(0.3deg); }
      33%      { transform: rotate(-0.4deg); }
      67%      { transform: rotate(0.6deg); }
    }
    @keyframes namlBoatRoll { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2.5deg)} }
    /* Ship hull: combined heave + 8deg heel to starboard */
    @keyframes namlShipHull {
      0%  { transform: translateY(0px) rotate(-8deg); }
      25% { transform: translateY(-1px) rotate(-9.5deg); }
      50% { transform: translateY(-3px) rotate(-8deg); }
      75% { transform: translateY(-1px) rotate(-6.5deg); }
      100%{ transform: translateY(0px) rotate(-8deg); }
    }
    @keyframes namlSailBow  { 0%{transform:scaleX(0.91) skewY(-0.8deg)} 100%{transform:scaleX(1.05) skewY(0.8deg)} }
    @keyframes namlWave     { 0%,100%{transform:translateX(0)} 50%{transform:translateX(3px)} }
    @keyframes namlDrgSwim  {
      0%  { transform: translateY(0px) rotate(-1deg); }
      25% { transform: translateY(-2.5px) rotate(1.5deg); }
      50% { transform: translateY(-0.5px) rotate(-0.8deg); }
      75% { transform: translateY(-2.8px) rotate(2deg); }
      100%{ transform: translateY(0px) rotate(-1deg); }
    }
    @keyframes namlTailSwish{ 0%{transform:rotate(-9deg)} 100%{transform:rotate(9deg)} }
    @keyframes namlFlicker  { 0%{transform:scale(0.78,0.82); opacity:0.45} 100%{transform:scale(1.18,1.12) translateX(2px); opacity:1} }
    @keyframes namlGlow     { 0%{opacity:0.15} 100%{opacity:0.5} }
    @media (prefers-reduced-motion:reduce){
      .naml-cring,.naml-needle,.naml-ship,.naml-sail,.naml-wv,.naml-drg,.naml-dtail,.naml-fire,.naml-fglow{
        animation:none!important; transform:none!important; }
