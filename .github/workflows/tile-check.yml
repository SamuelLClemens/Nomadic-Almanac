# Weekly map tile canary.
#
# Why: in November 2026 a tile vendor began answering every request with one fixed placeholder image
# as HTTP 200, so nothing in the app noticed and visitors saw a watermark across the map. The check
# fetches each basemap layer at several places and fails when the bytes are identical, an error comes
# back, or the reply is not an image (see scripts/check_tiles.py). It needs no secrets and no keys.
#
# Run it by hand at any time: Actions tab, "Map tile check", "Run workflow", or locally with
#   python3 scripts/check_tiles.py
#
# On failure the run turns red and one issue is opened (never a second while one is open), so the
# owner is notified by GitHub's normal issue email instead of having to look at the Actions tab.
# GitHub pauses scheduled workflows after 60 days without any repository activity; running the
# workflow once by hand switches it back on. Nothing in this file detects that pause.
#
# Two jobs on purpose. "tiles" fetches from the internet with a read-only token. "report" is the only
# job whose token can write issues, and it runs no repository code: it never checks anything out.
#
# The "already open" test looks for an open issue that carries the label below, not for words in a
# title. In a public repository anyone can open an issue titled "Map tile check failed" and so hide the
# next real alert; only people with triage access or above can apply a label, so the label cannot be
# forged from outside. The label is created on first use.
name: Map tile check

on:
  schedule:
    - cron: '17 6 * * 1'     # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run the tile canary
        run: python3 scripts/check_tiles.py

  report:
    needs: tiles
    # always() is required: without a status function a job is skipped as soon as its needed job fails.
    if: ${{ always() && needs.tiles.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write            # the only write permission in this workflow; no contents access
    steps:
      - name: Open an issue when the check fails
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_LABEL: tile-check
        run: |
          set -euo pipefail
          gh label create "$ALERT_LABEL" --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Opened by the weekly map tile check" --force
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ALERT_LABEL" --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" \
              --title "Map tile check failed" \
              --body "The weekly map tile check did not complete successfully: $RUN_URL. Open the run to see whether a basemap layer returned an error or a placeholder image, or whether the workflow itself could not start. For a basemap fault, run python3 scripts/check_tiles.py locally to see which layer, then update BASEMAP_CONFIGS in app.js and LAYERS in scripts/check_tiles.py together."
          else
            echo "Issue #$open is already open; not creating another."
          fi
