  <!-- ═══════════════════════════════════════════════ -->
  <!-- ANIMATED NORTH NEEDLE                          -->
  <!-- Drawn at absolute viewport coordinates.        -->
  <!-- transform-origin anchored to compass center.   -->
  <!-- ═══════════════════════════════════════════════ -->
  <g class="needle" style="transform-box: view-box; transform-origin: 240px 122px;">
    <!-- North arm: Vermillion tip -->
    <polygon points="240,72 246,116 240,123 234,116" fill="#C0392B"/>
    <!-- South arm: Parchment -->
    <polygon points="240,172 245,128 240,121 235,128" fill="#F2E8C9" opacity="0.9"/>
    <!-- Pivot circle: Brass Gold with parchment stroke -->
