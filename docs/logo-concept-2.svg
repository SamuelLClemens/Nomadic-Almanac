<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 295" width="480" height="295">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&amp;display=swap');

      .needle {
        animation: settleNorth 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                   microOscillate 4s ease-in-out 2.2s infinite;
        will-change: transform;
      }

      @keyframes settleNorth {
        0%   { transform: rotate(-110deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes microOscillate {
        0%   { transform: rotate(0deg); }
        25%  { transform: rotate(0.8deg); }
        75%  { transform: rotate(-0.8deg); }
        100% { transform: rotate(0deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .needle {
          animation: none !important;
          transform: rotate(0deg) !important;
        }
      }
    </style>
  </defs>

